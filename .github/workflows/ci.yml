name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_FILE: 'Wizz.sln'
  CONFIGURATION: 'Release'

jobs:
  # ==========================================
  # بناء واختبار
  # ==========================================
  build-and-test:
    name: Build & Test (.NET 10.0.x)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true

      - name: 📦 Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: 🏗️ Build solution
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-restore --nologo

      - name: 🧪 Run tests
        run: dotnet test ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-build --nologo --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/
          retention-days: 30

      - name: 📈 Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: '**/coverage.cobertura.xml'
          retention-days: 30

      - name: 📋 Test summary
        if: always()
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Project | Passed | Failed | Skipped |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|--------|---------|" >> $GITHUB_STEP_SUMMARY
          for file in TestResults/*.trx; do
            if [ -f "$file" ]; then
              project=$(basename "$file" .trx)
              passed=$(grep -c '<Result outcome="Passed"' "$file" || echo 0)
              failed=$(grep -c '<Result outcome="Failed"' "$file" || echo 0)
              skipped=$(grep -c '<Result outcome="Skipped"' "$file" || echo 0)
              echo "| $project | $passed | $failed | $skipped |" >> $GITHUB_STEP_SUMMARY
            fi
          done

  # ==========================================
  # تحليل الكود الثابت — بوابة خط أساس (Baseline Ratchet)
  # ==========================================
  # يوجد في الكود مخالفات StyleCop قديمة كثيرة (4,919 مخالفة فريدة) لم تُصلح بعد،
  # لذلك لا تُعامل كلها كأخطاء بناء. البوابة تفشل عند أي من الحالات التالية:
  #   1) خطأ بناء واحد أو أكثر.
  #   2) أي تحذير مترجم أو حزمة (CS/NU).
  #   3) ارتفاع عدد مخالفات SA عن خط الأساس في eng/stylecop-baseline.txt.
  # خفض الرقم في ملف خط الأساس مطلوب مع كل إصلاح، ولا يُرفع إلا بقرار موثق من Farid.
  code-analysis:
    name: Code Analysis (StyleCop baseline ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true

      - name: 📦 Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }} 

      - name: 🔍 Run analyzers (report only)
        run: |
          dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} \
            --no-restore --nologo --no-incremental --tl:off 2>&1 | tee stylecop.log

      - name: 🚦 Enforce analyzer baseline
        run: |
          set -euo pipefail
          errors=$(grep -c ': error ' stylecop.log || true)
          cs=$(grep -cE 'warning (CS|NU)[0-9]+' stylecop.log || true)
          sa=$(grep -oE 'warning SA[0-9]+.*' stylecop.log | sort -u | wc -l || true)
          sa=$(echo "$sa" | tr -d '[:space:]')
          baseline=$(grep -v '^#' eng/stylecop-baseline.txt | tr -d '[:space:]')

          {
            echo "## StyleCop / Analyzer Gate"
            echo ""
            echo "| Metric | Count | Threshold |"
            echo "|--------|-------|-----------|"
            echo "| Build errors | $errors | 0 |"
            echo "| Compiler/package warnings (CS/NU) | $cs | 0 |"
            echo "| Unique SA diagnostics | $sa | $baseline |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors build error(s) found."
            exit 1
          fi
          if [ "$cs" -gt 0 ]; then
            echo "::error::$cs compiler/package warning(s) must be fixed."
            exit 1
          fi
          if [ "$sa" -gt "$baseline" ]; then
            echo "::error::StyleCop diagnostics increased: $sa > baseline $baseline. Fix the new violations or justify a baseline change."
            exit 1
          fi
          echo "Analyzer gate passed: $sa unique SA diagnostics (baseline $baseline)."

      - name: 📤 Upload analyzer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stylecop-log
          path: stylecop.log
          retention-days: 7

  # ==========================================
  # فحص الأمان (Security Scan)
  # ==========================================
  security-scan:
    name: Security Scan (NuGet, Dependabot)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-test

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true

      - name: 🔍 Check for vulnerable packages
        run: dotnet list ${{ env.SOLUTION_FILE }} package --vulnerable --include-transitive

      - name: 📦 Check outdated packages
        run: dotnet list ${{ env.SOLUTION_FILE }} package --outdated --include-transitive

      - name: 📋 Security Summary
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "Vulnerable and outdated package check completed." >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # إنشاء الإصدار (Release)
  # ==========================================
  create-release:
    name: Create Release Assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-and-test, code-analysis, security-scan]
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true

      - name: 📦 Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }} 

      - name: 🏗️ Publish Presentation (Windows x64)
        run: |
          dotnet publish src/Wizz.Presentation/Wizz.Presentation/Wizz.Presentation.csproj \
            --configuration ${{ env.CONFIGURATION }} \
            --runtime win-x64 \
            --self-contained true \
            --output ./publish/win-x64 \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true

      - name: 📦 Create release archive
        run: |
          cd ./publish/win-x64
          zip -r ../../wizz-win-x64-${{ github.event.release.tag_name }}.zip .

      - name: 🚀 Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: wizz-win-x64-${{ github.event.release.tag_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # تحديث Dependabot (إذا كان هناك PR)
  # ==========================================
  dependabot-auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 🤖 Auto-approve & merge
        uses: ahmadnassri/action-dependabot-auto-merge@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          target: minor
          merge-method: squash
